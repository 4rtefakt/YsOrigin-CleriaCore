; The Archipelago client for Ys Origin, a CleriaCore Lua mod (README.md beside this file)
[mod]
Id=ysorigin.archipelago
Name="Archipelago"
Version=0.2.0
Author="4rtefakt"
Description="The Archipelago multiworld client for the Ys Origin apworld, written in Lua on CleriaCore's mod API: the AP protocol, checks sent on chest open, vanilla items swallowed with a relabelled treasure box, items granted (saved with the game, never twice), DeathLink, the goal, an item feed, a tracker and its settings under Mods > Archipelago."
Website="https://github.com/4rtefakt/ys-origin-cleriacore-ap"
ApiVersion=3
Script=main.lua
