; retail_probe_tests.ini - the test list of the Retail Probe panel.
; Edit freely, then press "Reload retail_probe_tests.ini" on the Helpers page
; (no rebuild, no restart). One [test <id>] section per button.
;
; Keys (all optional except question):
;   group       = heading the button is listed under
;   question    = the button's label
;   do          = what to do once you are there
;   watch       = what to look at
;   note        = anything else (how sure the staging is, what the answer decides)
;   status      = open | confirm (code already says so, a look confirms) | uncertain staging
;   character   = any | yunica | hugo | toal      (another character's test is greyed out
;                                                  unless the experimental switch is ticked)
;   difficulty  = keep | veryeasy | easy | normal | hard | nightmare
;   room        = S_1004            (empty: reload the room you are in)
;   pos         = x, y, z           (omit: the room's default spawn point)
;   facing      = degrees, the game's own door-arrival angle
;   level       = 1..99             (omit: keep)
;   weapon_tier = 0 Lv1, 1 Lv2, 2 Lv3, 4 Lv4, 6 Lv5, 8 Lv6, 10 Max
;   items       = 91, 88=3          item ids (0..127) to own; "id=count" for a count
;   flags       = 205=1, 220=0      story flags (128..511)
;   gear        = 7=1               armour / footwear upgrade cell by item id (1 = "Max")
;   skills      = wind=3, fire=1    bracelet owned + its level (0..3)
;   equip_skill = wind | thunder | fire | none
;   hp / mp     = full (default) | keep
;   boost       = full | empty      (full also unlocks the Boost gauge, flag 187)
;   sp          = number
;   config      = shadows=0, glare=1     set with the room load (never above the level
;                                        the game started with - that needs a restart)
;   config_buttons = shadows:0|2, glare:1|2    buttons that reload the room with that value
;                    names: shadows, reflections, glare, other (Other Simplification),
;                    caustics (1 = on)
;   helpers     = boss_hp_1, monsters_hp_1, invincible, hp_lock, boost, heal, mp
;   answers     = Yes | No | Unclear          the answer buttons
;   show_flags  = 450, 451                    flags shown next to the test
;
; Useful ids: boss defeated 220 Velagunder 221 Nygtilger 222 Gelaldy 223 Khonsclard
; 224 Pictimos 225 Zava 226 Dalles 227 Darm; duel done 230 S_1080 231 S_2080 232 S_3080
; 244 S_4013 235 S_6080 236 S_6099. Flag 205 = 1 makes a boss / duel room start the fight
; at once (the game's own Retry start); leave it out (or 205=0) to see the intro scene.
; Double jump = item 91 + flag 163. Dash = item 90 + flag 181. Bracelets = items 116 / 117 / 118.
;
; Dropped because the code settled them for certain (RETAIL_ANSWERS.md, 2026-10-12):
; SP on kill (C1), stun length and odds (C2), S_5013 falling steps (C3), jump on landing
; (C4), the HUD Lv / Max badges (C5), gem pickup sound (C6), Nightmare SP (C7), the
; soft-chest test P11 (C8: those rooms have no monsters).

[probe]
; Key that shows / hides the panel (a Windows virtual-key code). 0x24 = HOME.
toggle_vk = 0x24

