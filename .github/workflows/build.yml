# Build CleriaCore and run the tests that need no game data (ctest -LE assets). Game data never enters
# CI or the repo: the asset-reading tests carry the `assets` label (CMakeLists.txt) and run only on a
# machine with an unpacked game (TESTING.md). Third-party code is fetched inside the runner by
# tools/fetch_deps.py at the versions the Windows build uses (SDL3 3.4.12, wgpu-native v29.0.1.1, ...).
# Issue #46.
#
# Kept cheap: a pull request (and a push to master) builds Windows (MSVC) and Linux (gcc, clang) only, and
# a newer push cancels the older run. A branch push alone does not run: its pull request does, so a PR push
# is not built twice (any other branch runs by hand: gh workflow run build.yml --ref <branch>). Every job
# builds with Ninja through ccache (cache restored from the last run of the same job; Windows uses Ninja
# for per-file parallelism, which MSBuild without /MP lacks). macOS (billed at 10x) runs only by hand:
#   gh workflow run build.yml --ref <branch> -f macos=true      (then ONLY the macOS job runs)
name: build

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'build/**']
  pull_request:
    paths-ignore: ['**/*.md', 'build/**']
  workflow_dispatch:
    inputs:
      macos:
        description: Run only the macOS (clang) job
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || !inputs.macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cmake_args: -DCLERIA_FFMPEG=ON -DCLERIA_CURL=ON
            packages: libavformat-dev libavcodec-dev libswscale-dev libavutil-dev libcurl4-openssl-dev ffmpeg
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev ${{ matrix.packages }}

      # cl.exe and the x64 tools on PATH, for Ninja (the Visual Studio generator sets them up itself).
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_deps.py') }}

      - name: Fetch dependencies
        run: python tools/fetch_deps.py

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DCLERIA_TEST_ASSETS=${{ github.workspace }}/no-assets"

      - name: Build
        shell: bash
        run: cmake --build build --parallel -- -k 0   # report every failing file at once

      # Where the build time went: the ten slowest steps (ccache hits included) and the cache's hit rate.
      - name: Build profile
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c "
          rows = [l.split('\t') for l in open('build/.ninja_log') if not l.startswith('#')]
          for r in sorted(rows, key=lambda r: int(r[0]) - int(r[1]))[:10]: print(f'{(int(r[1]) - int(r[0])) / 1000:7.1f}s  {r[3]}')
          " || true
          ccache -s || true

      - name: Test (no game data)
        if: ${{ !cancelled() }}
        shell: bash
        run: ctest --test-dir build -C Release -LE assets --output-on-failure --timeout 600

      # The FFmpeg movie decoder on a generated XviD-tagged MPEG-4 AVI (the retail movies' codec).
      - name: Movie decoder (FFmpeg)
        if: ${{ !cancelled() && contains(matrix.cmake_args, 'CLERIA_FFMPEG=ON') }}
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x160:rate=60 -t 2 -c:v mpeg4 -vtag XVID -an test_movie.avi
          ./build/cleria-movietest --file test_movie.avi movie_frame.png

  macos:
    name: macos-clang
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: macOS packages
        run: |
          brew install ninja pkgconf ffmpeg curl
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl)" >> "$GITHUB_ENV"

      - name: Cache third_party
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_deps.py') }}

      - name: Fetch dependencies
        run: python3 tools/fetch_deps.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLERIA_FFMPEG=ON -DCLERIA_CURL=ON "-DCLERIA_TEST_ASSETS=${{ github.workspace }}/no-assets"

      - name: Build
        run: cmake --build build --parallel -- -k 0

      - name: Test (no game data)
        if: ${{ !cancelled() }}
        run: ctest --test-dir build -LE assets --output-on-failure --timeout 600

      - name: Movie decoder (FFmpeg)
        if: ${{ !cancelled() }}
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x160:rate=60 -t 2 -c:v mpeg4 -vtag XVID -an test_movie.avi
          ./build/cleria-movietest --file test_movie.avi movie_frame.png

      # cleria-view itself, with no game data: the first-run setup screen on the Metal adapter, drawn once
      # into an offscreen target and once into a shown window's CAMetalLayer surface, each frame read back.
      - name: Launch cleria-view (no game data)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          export CLERIA_DATA="$RUNNER_TEMP/no-data"
          CLERIA_SETUP_DRIVE="20:shot=setup_offscreen.ppm;21:quit" ./build/cleria-view
          CLERIA_DRIVE_VISIBLE=1 CLERIA_SETUP_DRIVE="20:shot=setup_window.ppm;21:quit" ./build/cleria-view
          python3 - setup_offscreen.ppm setup_window.ppm <<'EOF'
          import struct, sys, zlib
          for p in sys.argv[1:]:
              magic, size, _, px = open(p, 'rb').read().split(b'\n', 3)
              w, h = map(int, size.split())
              colours = len({px[i:i + 3] for i in range(0, len(px), 21)})
              print(f'{p}: {w}x{h}, {colours} colours')
              assert magic == b'P6' and len(px) == w * h * 3 and colours > 50, f'{p}: not the setup screen'
              raw = b''.join(b'\0' + px[y * w * 3:(y + 1) * w * 3] for y in range(h))
              chunk = lambda t, b: struct.pack('>I', len(b)) + t + b + struct.pack('>I', zlib.crc32(t + b))
              open(p[:-4] + '.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                                                + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))
          EOF

      - name: Upload the setup screen shots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-setup-screen
          path: setup_*.png
          if-no-files-found: ignore
